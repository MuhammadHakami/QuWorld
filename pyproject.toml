[project]
name = "quworld"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.40.0",
    "easydict>=1.13",
    "ftfy>=6.3.1",
    "h5py>=3.16.0",
    "huggingface-hub>=1.24.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "neuraloperator>=2.0.0",
    "numcodecs>=0.16.5",
    "numpy>=2.4.4",
    "pandas>=3.0.5",
    "ribs>=0.12.0",
    "s3fs>=2024.10.0",
    "scipy>=1.18.0",
    "the-well>=1.2.0",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "xarray>=2026.2.0",
    "zarr>=3.3.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
